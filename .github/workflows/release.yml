name: Release Build

on:
  release:
    types: [published]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-s
  PKG_CONFIG_PATH: /var/lib/flatpak/runtime/org.freedesktop.Sdk/x86_64/25.08/3912bfb67e8fbda84403f805028df718c7f12216fe5cafb8b54b8bb0d57ad955/files/lib/x86_64-linux-gnu/pkgconfig

jobs:
  release-linux:
    name: Linux (x86_64) Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/rustify

      - name: Package release artifact
        run: |
          mkdir -p dist/linux-x86_64
          cp target/release/rustify dist/linux-x86_64/rustify
          tar -czf rustify-linux-x86_64.tar.gz -C dist/linux-x86_64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-linux-x86_64-release
          path: rustify-linux-x86_64.tar.gz
          retention-days: 90

  release-windows:
    name: Windows (x86_64) Release
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package release artifact
        run: |
          mkdir -p dist/windows-x86_64
          cp target/release/rustify.exe dist/windows-x86_64/rustify.exe
          7z a rustify-windows-x86_64.zip dist/windows-x86_64/rustify.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-windows-x86_64-release
          path: rustify-windows-x86_64.zip
          retention-days: 90

  release-macos:
    name: macOS (x86_64 + Apple Silicon) Release
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package release artifact
        run: |
          mkdir -p dist/macos-universal
          cp target/release/rustify dist/macos-universal/rustify
          tar -czf rustify-macos-universal.tar.gz -C dist/macos-universal rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-macos-universal-release
          path: rustify-macos-universal.tar.gz
          retention-days: 90

  release-create:
    name: Create GitHub Release
    needs: [release-linux, release-windows, release-macos]
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/rustify-linux-x86_64-release/rustify-linux-x86_64.tar.gz
            release-artifacts/rustify-windows-x86_64-release/rustify-windows-x86_64.zip
            release-artifacts/rustify-macos-universal-release/rustify-macos-universal.tar.gz
