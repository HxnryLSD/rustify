name: Debug Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /var/lib/flatpak/runtime/org.freedesktop.Sdk/x86_64/25.08/3912bfb67e8fbda84403f805028df718c7f12216fe5cafb8b54b8bb0d57ad955/files/lib/x86_64-linux-gnu/pkgconfig

jobs:
  debug-linux:
    name: Linux (x86_64) Debug
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build debug binary
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-linux-x86_64-debug
          path: target/debug/rustify
          retention-days: 7

  debug-windows:
    name: Windows (x86_64) Debug
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build debug binary
        run: cargo build

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-windows-x86_64-debug
          path: target/debug/rustify.exe
          retention-days: 7

  debug-macos:
    name: macOS (x86_64) Debug
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build debug binary
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-macos-x86_64-debug
          path: target/debug/rustify
          retention-days: 7
