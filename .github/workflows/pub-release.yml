name: Release

# A release is cut by pushing a tag that starts with "v". The workflow
# builds every platform and attaches the binaries to that tag.
#
# The manual trigger re-runs the build for a tag that already exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish, for example v1.0.0"
        required: true
        type: string

# The build jobs only need to read the repository. Write access is granted
# to the job that publishes the release.
permissions:
  contents: read

# A release must never be cancelled half way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-s

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      # Work out which tag to publish, before anything expensive runs.
      # Without this a manual run would publish a release tagged with the
      # branch name.
      - name: Work out the release tag
        id: target
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          case "$tag" in
            v[0-9]*)
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::No release tag. Push a tag that starts with v, or give the tag input."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # These reach Spotify and YouTube. They are advisory here: a third
      # party's outage must not stop a release that has already been decided.
      - name: Test against the live Spotify and YouTube APIs
        continue-on-error: true
        run: cargo test --locked -- --ignored

  release-linux:
    name: Linux (x86_64) Release
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/linux-x86_64
          cp target/release/rustify dist/linux-x86_64/rustify
          tar -czf rustify-linux-x86_64.tar.gz -C dist/linux-x86_64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustify-linux-x86_64-release
          path: rustify-linux-x86_64.tar.gz
          retention-days: 90

  release-windows:
    name: Windows (x86_64) Release
    runs-on: windows-2022
    needs: check
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/windows-x86_64
          cp target/release/rustify.exe dist/windows-x86_64/rustify.exe
          7z a rustify-windows-x86_64.zip dist/windows-x86_64/rustify.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustify-windows-x86_64-release
          path: rustify-windows-x86_64.zip
          retention-days: 90

  release-macos:
    name: macOS (Apple Silicon) Release
    runs-on: macos-15
    needs: check
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/macos-aarch64
          cp target/release/rustify dist/macos-aarch64/rustify
          tar -czf rustify-macos-aarch64.tar.gz -C dist/macos-aarch64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustify-macos-aarch64-release
          path: rustify-macos-aarch64.tar.gz
          retention-days: 90

  release-macos-intel:
    name: macOS (Intel) Release
    runs-on: macos-15-intel
    needs: check
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/macos-x86_64
          cp target/release/rustify dist/macos-x86_64/rustify
          tar -czf rustify-macos-x86_64.tar.gz -C dist/macos-x86_64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustify-macos-x86_64-release
          path: rustify-macos-x86_64.tar.gz
          retention-days: 90

  release-create:
    name: Create GitHub Release
    needs: [check, release-linux, release-windows, release-macos, release-macos-intel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          body: |
            Rustify ${{ needs.check.outputs.tag }}.

            - Linux x86_64: `rustify-linux-x86_64.tar.gz`
            - Windows x86_64: `rustify-windows-x86_64.zip`
            - macOS Apple Silicon: `rustify-macos-aarch64.tar.gz`
            - macOS Intel: `rustify-macos-x86_64.tar.gz`
          files: |
            release-artifacts/rustify-linux-x86_64-release/rustify-linux-x86_64.tar.gz
            release-artifacts/rustify-windows-x86_64-release/rustify-windows-x86_64.zip
            release-artifacts/rustify-macos-aarch64-release/rustify-macos-aarch64.tar.gz
            release-artifacts/rustify-macos-x86_64-release/rustify-macos-x86_64.tar.gz
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
