name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-s

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test against the live Spotify and YouTube APIs
        run: cargo test --locked -- --ignored

  release-linux:
    name: Linux (x86_64) Release
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/linux-x86_64
          cp target/release/rustify dist/linux-x86_64/rustify
          tar -czf rustify-linux-x86_64.tar.gz -C dist/linux-x86_64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-linux-x86_64-release
          path: rustify-linux-x86_64.tar.gz
          retention-days: 90

  release-windows:
    name: Windows (x86_64) Release
    runs-on: windows-2022
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/windows-x86_64
          cp target/release/rustify.exe dist/windows-x86_64/rustify.exe
          7z a rustify-windows-x86_64.zip dist/windows-x86_64/rustify.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-windows-x86_64-release
          path: rustify-windows-x86_64.zip
          retention-days: 90

  release-macos:
    name: macOS (Apple Silicon) Release
    runs-on: macos-14
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/macos-aarch64
          cp target/release/rustify dist/macos-aarch64/rustify
          tar -czf rustify-macos-aarch64.tar.gz -C dist/macos-aarch64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-macos-aarch64-release
          path: rustify-macos-aarch64.tar.gz
          retention-days: 90

  release-create:
    name: Create GitHub Release
    needs: [release-linux, release-windows, release-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.release.tag_name || github.ref_name }}
          body: ${{ github.event.release.body || 'Rustify release' }}
          files: |
            release-artifacts/rustify-linux-x86_64-release/rustify-linux-x86_64.tar.gz
            release-artifacts/rustify-windows-x86_64-release/rustify-windows-x86_64.zip
            release-artifacts/rustify-macos-aarch64-release/rustify-macos-aarch64.tar.gz
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
