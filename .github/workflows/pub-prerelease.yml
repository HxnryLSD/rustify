name: Publish Prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-s
  PKG_CONFIG_PATH: /var/lib/flatpak/runtime/org.freedesktop.Sdk/x86_64/25.08/3912bfb67e8fbda84403f805028df718c7f12216fe5cafb8b54b8bb0d57ad955/files/lib/x86_64-linux-gnu/pkgconfig

jobs:
  prerelease-linux:
    name: Linux (x86_64) Prerelease
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/rustify

      - name: Package release artifact
        run: |
          mkdir -p dist/linux-x86_64
          cp target/release/rustify dist/linux-x86_64/rustify
          tar -czf rustify-linux-x86_64.tar.gz -C dist/linux-x86_64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-linux-x86_64-prerelease
          path: rustify-linux-x86_64.tar.gz
          retention-days: 90

  prerelease-windows:
    name: Windows (x86_64) Prerelease
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package release artifact
        run: |
          mkdir -p dist/windows-x86_64
          cp target/release/rustify.exe dist/windows-x86_64/rustify.exe
          7z a rustify-windows-x86_64.zip dist/windows-x86_64/rustify.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-windows-x86_64-prerelease
          path: rustify-windows-x86_64.zip
          retention-days: 90

  prerelease-macos:
    name: macOS (x86_64 + Apple Silicon) Prerelease
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package release artifact
        run: |
          mkdir -p dist/macos-universal
          cp target/release/rustify dist/macos-universal/rustify
          tar -czf rustify-macos-universal.tar.gz -C dist/macos-universal rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-macos-universal-prerelease
          path: rustify-macos-universal.tar.gz
          retention-days: 90

  prerelease-create:
    name: Create GitHub Prerelease
    needs: [prerelease-linux, prerelease-windows, prerelease-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: prerelease-artifacts

      - name: Create or update prerelease
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_id }}
          name: Rustify Nightly Prerelease
          body: |
            Automated prerelease build from `main` (run ${{ github.run_id }}).
            - Linux x86_64: `rustify-linux-x86_64.tar.gz`
            - Windows x86_64: `rustify-windows-x86_64.zip`
            - macOS Universal: `rustify-macos-universal.tar.gz`
          files: |
            prerelease-artifacts/rustify-linux-x86_64-prerelease/rustify-linux-x86_64.tar.gz
            prerelease-artifacts/rustify-windows-x86_64-prerelease/rustify-windows-x86_64.zip
            prerelease-artifacts/rustify-macos-universal-prerelease/rustify-macos-universal.tar.gz
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
