name: Prerelease

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-s

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test against the live Spotify and YouTube APIs
        run: cargo test --locked -- --ignored

  prerelease-linux:
    name: Linux (x86_64) Prerelease
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/linux-x86_64
          cp target/release/rustify dist/linux-x86_64/rustify
          tar -czf rustify-linux-x86_64.tar.gz -C dist/linux-x86_64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-linux-x86_64-prerelease
          path: rustify-linux-x86_64.tar.gz
          retention-days: 90

  prerelease-windows:
    name: Windows (x86_64) Prerelease
    runs-on: windows-2022
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/windows-x86_64
          cp target/release/rustify.exe dist/windows-x86_64/rustify.exe
          7z a rustify-windows-x86_64.zip dist/windows-x86_64/rustify.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-windows-x86_64-prerelease
          path: rustify-windows-x86_64.zip
          retention-days: 90

  prerelease-macos:
    name: macOS (Apple Silicon) Prerelease
    runs-on: macos-15
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/macos-aarch64
          cp target/release/rustify dist/macos-aarch64/rustify
          tar -czf rustify-macos-aarch64.tar.gz -C dist/macos-aarch64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-macos-aarch64-prerelease
          path: rustify-macos-aarch64.tar.gz
          retention-days: 90

  prerelease-macos-intel:
    name: macOS (Intel) Prerelease
    runs-on: macos-15-intel
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        run: |
          mkdir -p dist/macos-x86_64
          cp target/release/rustify dist/macos-x86_64/rustify
          tar -czf rustify-macos-x86_64.tar.gz -C dist/macos-x86_64 rustify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustify-macos-x86_64-prerelease
          path: rustify-macos-x86_64.tar.gz
          retention-days: 90

  prerelease-create:
    name: Create GitHub Prerelease
    needs: [prerelease-linux, prerelease-windows, prerelease-macos, prerelease-macos-intel]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: prerelease-artifacts

      - name: Create or update prerelease
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_id }}
          name: Rustify Nightly Prerelease
          body: |
            Automated prerelease build from `${{ github.ref_name }}` (run ${{ github.run_id }}).
            - Linux x86_64: `rustify-linux-x86_64.tar.gz`
            - Windows x86_64: `rustify-windows-x86_64.zip`
            - macOS Apple Silicon: `rustify-macos-aarch64.tar.gz`
            - macOS Intel: `rustify-macos-x86_64.tar.gz`
          files: |
            prerelease-artifacts/rustify-linux-x86_64-prerelease/rustify-linux-x86_64.tar.gz
            prerelease-artifacts/rustify-windows-x86_64-prerelease/rustify-windows-x86_64.zip
            prerelease-artifacts/rustify-macos-aarch64-prerelease/rustify-macos-aarch64.tar.gz
            prerelease-artifacts/rustify-macos-x86_64-prerelease/rustify-macos-x86_64.tar.gz
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
