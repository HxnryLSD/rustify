[package]
name = "rustify"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight, privacy-focused unofficial Spotify client"
license = "MIT"
readme = "README.md"

[dependencies]
# GUI
egui = "0.37"
# The glow (OpenGL) backend is lighter and more widely available than wgpu,
# which matters for a small desktop client.
eframe = { version = "0.37", features = ["glow"] }
egui_extras = { version = "0.37", features = ["all_loaders"] }
image = { version = "0.25", features = ["jpeg", "png"] }

# Audio
rodio = "0.23"

# HTTP
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "rustls-native-certs",
    "http2",
    "charset",
    "gzip",
    "stream",
    "query",
    "form",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "process"] }

# Config file format
toml = "1.0"

# Platform directories
dirs = "7.0"

# URL parsing
url = "2.5"

# Native file dialogs (the XDG portal on Linux, no GTK needed)
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

# TOTP (RFC 6238) for the Spotify web-player token exchange
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
data-encoding = "2.9"

# Random values for the OAuth PKCE verifier and state
rand = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
